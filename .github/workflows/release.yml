name: Build and release CLI

# Tags only. This builds and publishes four targets, two of them macOS at ten
# times the minutes, and it was running on every push to main — spending the
# most expensive runners there are to fail on its second step, which it did
# every time for as long as it has existed.
#
# A workflow named "Build and release" should run when there is something to
# release.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CORE_REPOSITORY: uncached-app/uncached-core

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            package: cli-win32-x64
            binary: uncached.exe
          - runner: macos-latest
            target: x86_64-apple-darwin
            package: cli-darwin-x64
            binary: uncached
          - runner: macos-latest
            target: aarch64-apple-darwin
            package: cli-darwin-arm64
            binary: uncached
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: cli-linux-x64
            binary: uncached

    steps:
      - uses: actions/checkout@v4

      - name: Read pinned core revision
        shell: bash
        run: |
          # Seven to forty, because Cargo accepts a short rev and this one is
          # written short. Demanding forty matched nothing, so the variable was
          # empty and this step failed on every run it has ever had.
          core_rev=$(sed -n 's/.*rev = "\([0-9a-f]\{7,40\}\)".*/\1/p' Cargo.toml)
          test -n "$core_rev" || { echo "Cargo.toml has no pinned uncached-core revision" >&2; exit 1; }
          echo "Pinned core revision: $core_rev"
          echo "CORE_REV=$core_rev" >> "$GITHUB_ENV"

      - name: Reject fork pull request without private-core access
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        shell: bash
        run: |
          echo "Fork pull requests cannot receive UNCACHED_CORE_DEPLOY_KEY; run this check from a branch in the main repository or use a trusted maintainer-triggered workflow." >&2
          exit 1

      - name: Require private core deploy key
        shell: bash
        env:
          UNCACHED_CORE_DEPLOY_KEY: ${{ secrets.UNCACHED_CORE_DEPLOY_KEY }}
        run: |
          if [ -z "$UNCACHED_CORE_DEPLOY_KEY" ]; then
            echo "Missing Actions secret UNCACHED_CORE_DEPLOY_KEY; configure a read-only deploy key for $CORE_REPOSITORY." >&2
            exit 1
          fi

      - name: Load private core deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.UNCACHED_CORE_DEPLOY_KEY }}

      - name: Configure Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Test Rust CLI
        run: cargo test

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify build checksum
        shell: bash
        env:
          BINARY: target/${{ matrix.target }}/release/${{ matrix.binary }}
        run: |
          build_digest=$(node --input-type=module -e "import { createHash } from 'node:crypto'; import { readFile } from 'node:fs/promises'; console.log(createHash('sha256').update(await readFile(process.env.BINARY)).digest('hex'));" )
          echo "Built binary SHA-256: $build_digest"
          echo "BUILD_DIGEST=$build_digest" >> "$GITHUB_ENV"

      - name: Stage platform package
        shell: bash
        run: node scripts/stage-platform-package.mjs --target "${{ matrix.target }}" --binary "target/${{ matrix.target }}/release/${{ matrix.binary }}" --package-dir "packages/${{ matrix.package }}"

      - name: Compare staged checksum
        shell: bash
        env:
          BINARY: packages/${{ matrix.package }}/bin/${{ matrix.binary }}
        run: |
          staged_digest=$(node --input-type=module -e "import { createHash } from 'node:crypto'; import { readFile } from 'node:fs/promises'; console.log(createHash('sha256').update(await readFile(process.env.BINARY)).digest('hex'));" )
          echo "Staged binary SHA-256: $staged_digest"
          test "$BUILD_DIGEST" = "$staged_digest" || { echo "Build/staged checksum mismatch" >&2; exit 1; }

      - name: Smoke test disposable fixture
        shell: bash
        env:
          BINARY: packages/${{ matrix.package }}/bin/${{ matrix.binary }}
        run: |
          node --input-type=module <<'NODE'
          import { homedir } from 'node:os';
          import { parse, join } from 'node:path';
          import { existsSync, mkdirSync, readdirSync, rmSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';

          const binary = process.env.BINARY;
          const fixture = join(process.env.RUNNER_TEMP, 'uncached-smoke');
          rmSync(fixture, { recursive: true, force: true });
          mkdirSync(join(fixture, 'node_modules', 'disposable-package'), { recursive: true });
          mkdirSync(join(fixture, 'unrelated-fixture'), { recursive: true });
          writeFileSync(join(fixture, 'package.json'), JSON.stringify({ name: 'uncached-smoke-fixture', version: '1.0.0' }));
          writeFileSync(join(fixture, 'node_modules', 'disposable-package', 'package.json'), JSON.stringify({ name: 'disposable-package', version: '1.0.0' }));
          writeFileSync(join(fixture, 'unrelated-fixture', 'keep.txt'), 'must remain');

          function walk(root) {
            const found = new Set();
            if (!existsSync(root)) return found;
            const visit = (path) => {
              let entries;
              try { entries = readdirSync(path, { withFileTypes: true }); } catch { return; }
              for (const entry of entries) {
                const child = join(path, entry.name);
                found.add(child);
                if (entry.isDirectory()) visit(child);
              }
            };
            visit(root);
            return found;
          }

          const home = homedir();
          const trashRoots = process.platform === 'win32'
            ? [join(parse(home).root, '$Recycle.Bin')]
            : process.platform === 'darwin'
              ? [join(home, '.Trash')]
              : [join(process.env.XDG_DATA_HOME ?? join(home, '.local', 'share'), 'Trash', 'files'), join(home, '.local', 'share', 'Trash', 'files')];
          const before = new Set(trashRoots.flatMap((root) => [...walk(root)]));
          const cancelled = spawnSync(binary, ['scan', fixture], { input: 'n\n', encoding: 'utf8' });
          if (cancelled.status !== 0) throw new Error(`N smoke test failed: ${cancelled.stderr}`);
          if (!existsSync(join(fixture, 'node_modules'))) throw new Error('N confirmation removed disposable target');
          const confirmed = spawnSync(binary, ['scan', fixture], { input: 'y\n', encoding: 'utf8' });
          if (confirmed.status !== 0) throw new Error(`y smoke test failed: ${confirmed.stderr}`);
          if (existsSync(join(fixture, 'node_modules'))) throw new Error('y confirmation did not move node_modules');
          if (!existsSync(join(fixture, 'unrelated-fixture', 'keep.txt'))) throw new Error('unrelated fixture was changed');
          const after = new Set(trashRoots.flatMap((root) => [...walk(root)]));
          const moved = [...after].some((entry) => !before.has(entry));
          if (!moved) throw new Error(`target was not observed in system Trash (${trashRoots.join(', ')})`);
          console.log('Smoke test verified N preservation, lowercase y cleanup, system Trash movement, and unrelated fixture preservation.');
          NODE

      - name: Pack and install launcher with matching platform package
        shell: bash
        run: |
          root_tarball=$(npm pack --json | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data)[0].filename));")
          platform_tarball=$(cd "packages/${{ matrix.package }}" && npm pack --json | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data)[0].filename));")
          smoke_root="$RUNNER_TEMP/uncached-npm-install"
          smoke_workspace="$RUNNER_TEMP/uncached-npm-fixture"
          rm -rf "$smoke_root" "$smoke_workspace"
           mkdir -p "$smoke_root" "$smoke_workspace/node_modules/disposable-package" "$smoke_workspace/unrelated-fixture"
           printf '{"name":"uncached-npm-fixture","version":"1.0.0"}\n' > "$smoke_workspace/package.json"
           printf '{"name":"disposable-package","version":"1.0.0"}\n' > "$smoke_workspace/node_modules/disposable-package/package.json"
           printf 'must remain\n' > "$smoke_workspace/unrelated-fixture/keep.txt"
           npm install --prefix "$smoke_root" --no-save --ignore-scripts "$PWD/$root_tarball" "$PWD/packages/${{ matrix.package }}/$platform_tarball"
           SMOKE_ROOT="$smoke_root" SMOKE_WORKSPACE="$smoke_workspace" node --input-type=module <<'NODE'
           import { homedir } from 'node:os';
           import { parse, join } from 'node:path';
           import { existsSync, readdirSync, rmSync } from 'node:fs';
           import { spawnSync } from 'node:child_process';

           const root = process.env.SMOKE_ROOT;
           const fixture = process.env.SMOKE_WORKSPACE;
           const npx = process.platform === 'win32' ? 'npx.cmd' : 'npx';
           // Runs installed `npx --no-install uncached scan <fixture>` without registry fallback.
           const walk = (directory) => {
             const found = new Set();
             if (!existsSync(directory)) return found;
             const visit = (path) => {
               let entries;
               try { entries = readdirSync(path, { withFileTypes: true }); } catch { return; }
               for (const entry of entries) {
                 const child = join(path, entry.name);
                 found.add(child);
                 if (entry.isDirectory()) visit(child);
               }
             };
             visit(directory);
             return found;
           };
           const home = homedir();
           const trashRoots = process.platform === 'win32'
             ? [join(parse(home).root, '$Recycle.Bin')]
             : process.platform === 'darwin'
               ? [join(home, '.Trash')]
               : [join(process.env.XDG_DATA_HOME ?? join(home, '.local', 'share'), 'Trash', 'files'), join(home, '.local', 'share', 'Trash', 'files')];
           const before = new Set(trashRoots.flatMap((trash) => [...walk(trash)]));
           const run = (answer) => spawnSync(npx, ['--no-install', 'uncached', 'scan', fixture], { cwd: root, input: `${answer}\n`, encoding: 'utf8' });
           const cancelled = run('N');
           if (cancelled.status !== 0) throw new Error(`N smoke test failed: ${cancelled.stderr}`);
           if (!existsSync(join(fixture, 'node_modules'))) throw new Error('N confirmation removed node_modules');
           const confirmed = run('y');
           if (confirmed.status !== 0) throw new Error(`lowercase y smoke test failed: ${confirmed.stderr}`);
           if (existsSync(join(fixture, 'node_modules'))) throw new Error('lowercase y did not move node_modules');
           if (!existsSync(join(fixture, 'unrelated-fixture', 'keep.txt'))) throw new Error('unrelated fixture was changed');
           const after = new Set(trashRoots.flatMap((trash) => [...walk(trash)]));
           if (![...after].some((entry) => !before.has(entry))) throw new Error(`node_modules was not observed in system Trash (${trashRoots.join(', ')})`);
           rmSync(fixture, { recursive: true, force: true });
           console.log('Packed launcher verified N cancellation, lowercase y Trash movement, and unrelated fixture preservation.');
           NODE

      - name: Preview package contents
        shell: bash
        run: npm pack --dry-run
        working-directory: packages/${{ matrix.package }}

      - name: Preview root publication
        run: npm pack --dry-run && npm publish --dry-run --ignore-scripts

      - name: Upload staged package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.package }}
          path: packages/${{ matrix.package }}
          if-no-files-found: error

  publish-platform:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - cli-win32-x64
          - cli-darwin-x64
          - cli-darwin-arm64
          - cli-linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: package-${{ matrix.package }}
          path: packages/${{ matrix.package }}
      - name: Require npm token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: test -n "$NPM_TOKEN" || { echo "Missing Actions secret NPM_TOKEN; release is gated until npm authentication is configured." >&2; exit 1; }
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./packages/${{ matrix.package }}/package.json').version")"
      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "packages/${{ matrix.package }}" --access public

  publish-root:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: publish-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Require npm token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: test -n "$NPM_TOKEN" || { echo "Missing Actions secret NPM_TOKEN; release is gated until npm authentication is configured." >&2; exit 1; }
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - name: Publish root launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
